<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>登录 — ShadeMark</title>
<link rel="canonical" href="https://shademark.cn/login">
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.png" type="image/png">
<style>
:root{
  --bg:#0d0d0f;--card:#17171b;--border:#2a2a33;
  --panel:#17171b;--radius:12px;--radius-sm:8px;
  --text:#e8e8ea;--muted:#8a8a94;--accent:#7c6cf0;
  --danger:#f87171;--error:#f87171;--success:#4ade80;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh}

/* —— 登录 / 注册弹窗：与全站同一套（modal-card + modal-head + tabs + ×）—— */
.modal{display:none;position:fixed;inset:0;background:rgba(6,6,9,.72);backdrop-filter:blur(4px);z-index:300;align-items:center;justify-content:center;padding:20px}
.modal.active{display:flex}
.modal-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);width:100%;max-width:380px;padding:24px;max-height:88vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.brand-mini{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text);margin-bottom:18px}
.brand-mini img{width:32px;height:32px;object-fit:contain;border-radius:8px}
.brand-mini span{font-size:16px;font-weight:700;letter-spacing:-0.02em;color:var(--text)}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.modal .tabs{display:flex;gap:6px}
.modal .tab{background:transparent;border:1px solid var(--border);color:var(--muted);padding:7px 16px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;font-family:inherit}
.modal .tab.active{background:var(--accent);border-color:var(--accent);color:#fff}
.modal-close{background:none;border:none;color:var(--muted);font-size:22px;line-height:1;cursor:pointer;padding:0 4px}
.modal-close:hover{color:var(--text)}
.modal-card input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);padding:11px 12px;font-size:14px;outline:none;margin-bottom:12px;min-height:44px;font-family:inherit}
.modal-card input:focus{border-color:var(--accent)}
.auth-submit{width:100%;background:var(--accent);color:#fff;border:none;border-radius:6px;padding:12px;font-size:14px;font-weight:600;cursor:pointer;transition:filter .2s;min-height:46px;font-family:inherit}
.auth-submit:hover{filter:brightness(.9)}
.auth-submit:disabled{opacity:.5}
.auth-error{color:var(--error);font-size:13px;margin:-4px 0 12px;display:none}
.auth-forgot{display:none;text-align:right;margin:-6px 0 12px}
.auth-forgot a{color:var(--muted);font-size:13px;text-decoration:underline;text-underline-offset:3px;text-decoration-color:rgba(138,138,148,.45);transition:color .2s,text-decoration-color .2s}
.auth-forgot a:hover{color:var(--accent);text-decoration-color:var(--accent)}
.auth-tip{color:var(--muted);font-size:12px;margin-top:12px;text-align:center;line-height:1.6}
@media(max-width:600px){.modal{padding:16px}.modal-card{padding:20px}}
</style>
</head>
<body>

<!-- 登录弹窗：页面打开即弹出（与首页 / 水印 / 报价单 / 发码 / 短链同一套） -->
<div class="modal active" id="authModal">
  <div class="modal-card">
    <a class="brand-mini" href="/"><img src="/logo.png" alt="ShadeMark"><span>ShadeMark</span></a>
    <div class="modal-head">
      <div class="tabs">
        <button class="tab active" id="tabLogin">登录</button>
        <button class="tab" id="tabRegister">注册</button>
      </div>
      <button class="modal-close" id="authCloseBtn" aria-label="关闭">&times;</button>
    </div>
    <form id="authForm">
      <input type="email" id="authEmail" placeholder="邮箱" autocomplete="off" />
      <input type="password" id="authPass" placeholder="密码" autocomplete="new-password" />
      <div class="auth-forgot" id="authForgot"><a href="/forgot">忘记密码？</a></div>
      <div id="authNameWrap" style="display:none"><input id="authName" placeholder="昵称（可选）" autocomplete="off" /></div>
      <div id="authContactWrap" style="display:none"><input id="authContact" placeholder="联系方式（可选）：微信号或手机号" autocomplete="off" /></div>
      <div class="auth-error" id="authError"></div>
      <button class="auth-submit" id="authSubmitBtn" type="submit">登录</button>
    </form>
    <p class="auth-tip" id="authTip"></p>
  </div>
</div>

<script>
(function(){
  var $=function(id){return document.getElementById(id)};
  var mode='login', sending=false;

  // —— 登录后落点 ——
  // 1) 带 ?next= 时回原页（只接受站内路径，防开放重定向）；2) 否则按角色：
  //    platform=平台方 → /platform；user=普通用户 → /admin（各自的后台）
  function nextTarget(){
    var raw=new URLSearchParams(location.search).get('next')||'';
    if(!/^\/[A-Za-z0-9][A-Za-z0-9\-._~\/?=&%]*$/.test(raw))return '';
    if(/^\/(login|forgot|reset)(\/|$|\?)/.test(raw))return '';
    return raw;
  }
  function landingAfter(role){return nextTarget()||(role==='platform'?'/platform':'/admin')}
  // 关掉登录框 = 离开本页（能回原页就回原页，否则回首页）
  function goHome(){ location.href = nextTarget() || '/'; }

  function setMode(m){
    mode=m;
    $('tabLogin').classList.toggle('active',m==='login');
    $('tabRegister').classList.toggle('active',m==='register');
    $('authNameWrap').style.display=m==='register'?'block':'none';
    $('authContactWrap').style.display=m==='register'?'block':'none';
    $('authForgot').style.display=m==='login'?'block':'none';
    $('authSubmitBtn').textContent=m==='login'?'登录':'注册';
    $('authError').style.display='none';
    $('authPass').autocomplete='new-password';
    $('authEmail').setAttribute('autocomplete','off');
    $('authName').setAttribute('autocomplete','off');
    $('authContact').setAttribute('autocomplete','off');
    $('authTip').textContent=m==='login'
      ? '还没有账号？点击上方「注册」，或直接返回继续浏览工具。'
      : '已有账号？点击上方「登录」。注册即可使用短链与发码平台。';
  }

  function submitAuth(ev){
    ev.preventDefault();
    if(sending)return;
    var email=$('authEmail').value.trim();
    var pass=$('authPass').value;
    var err=$('authError');
    err.style.display='none';
    if(!email||!pass){err.textContent='请填写邮箱和密码';err.style.display='block';return}
    if(mode==='register'){
      if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){err.textContent='请填写有效的邮箱地址';err.style.display='block';return}
      if(pass.length<6){err.textContent='密码至少6位';err.style.display='block';return}
    }
    var btn=$('authSubmitBtn'), old=btn.textContent;
    sending=true; btn.disabled=true; btn.textContent='请稍候…';
    var url=mode==='login'?'/api/auth/login':'/api/auth/register';
    var body=mode==='login'
      ? {email:email,password:pass}
      : {email:email,password:pass,display_name:$('authName').value.trim(),contact:$('authContact').value.trim()};
    fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
      .then(function(r){return r.json().catch(function(){return {}})})
      .then(function(d){
        if(d.error){err.textContent=d.error;err.style.display='block';return}
        location.href = mode==='login' ? landingAfter(d.role) : (nextTarget()||'/admin');
      })
      .catch(function(){err.textContent='网络错误，请稍后再试';err.style.display='block'})
      .then(function(){sending=false;btn.disabled=false;btn.textContent=old});
  }

  $('tabLogin').addEventListener('click',function(){setMode('login')});
  $('tabRegister').addEventListener('click',function(){setMode('register')});
  $('authCloseBtn').addEventListener('click',goHome);
  $('authForm').addEventListener('submit',submitAuth);
  $('authModal').addEventListener('click',function(e){if(e.target.id==='authModal')goHome()});
  document.addEventListener('keydown',function(e){if(e.key==='Escape')goHome()});
  $('authEmail').addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();submitAuth(e)}});
  $('authPass').addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();submitAuth(e)}});

  setMode('login');
})();
</script>
</body>
</html>
