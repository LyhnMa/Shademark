<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>登录 — ShadeMark</title>
<link rel="icon" href="/logo.png" type="image/png">
<style>
:root{
  --bg:#0d0d0f;--card:#17171b;--border:#2a2a33;
  --text:#e8e8ea;--muted:#8a8a94;--accent:#7c6cf0;
  --danger:#f87171;--success:#4ade80;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;overflow-x:hidden}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:32px;width:100%;max-width:400px}
.logo{text-align:center;margin-bottom:28px}
.logo img{width:32px;height:32px;object-fit:contain;border-radius:8px;margin-bottom:12px}
.logo h1{font-size:20px;font-weight:700;letter-spacing:-0.02em}
.logo p{color:var(--muted);font-size:13px;margin-top:4px}
.tabs{display:flex;gap:0;margin-bottom:24px;background:#101014;border-radius:8px;padding:3px}
.tab{flex:1;padding:9px;text-align:center;border-radius:6px;cursor:pointer;font-size:14px;font-weight:600;color:var(--muted);transition:all .2s}
.tab.active{background:var(--accent);color:#fff}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.form-group input{width:100%;padding:10px 12px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:14px;outline:none;transition:border-color .2s}
.form-group input:focus{border-color:var(--accent)}
.field-hint{color:var(--muted);font-size:12px;margin-top:6px;line-height:1.6}
.row-help{text-align:right;margin-top:8px}
.row-help a{color:var(--muted);font-size:13px;text-decoration:underline;text-underline-offset:3px;text-decoration-color:rgba(138,138,148,.45);transition:color .2s,text-decoration-color .2s}
.row-help a:hover{color:var(--accent);text-decoration-color:var(--accent)}
.btn{width:100%;padding:11px;border:none;border-radius:6px;font-size:14px;font-weight:700;cursor:pointer;transition:all .2s;background:var(--accent);color:#fff}
.btn:hover{opacity:.88}
.btn:disabled{opacity:.5;cursor:not-allowed}
.error{color:var(--danger);font-size:13px;margin-top:8px;display:none}
.footer{text-align:center;margin-top:20px;font-size:12px;color:var(--muted)}
.footer a{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border:1px solid var(--border);border-radius:6px;color:var(--muted);text-decoration:none;font-size:13px;font-weight:600;transition:all .2s}
.footer a:hover{color:var(--text);border-color:var(--accent)}
@media(max-width:480px){
  body{padding:16px;align-items:flex-start;padding-top:48px}
  .card{padding:24px 20px}
}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <img src="/logo.png" alt="Logo">
    <h1>ShadeMark</h1>
    <p>登录后使用发码、短链、模板与历史</p>
  </div>
  <div class="tabs">
    <div class="tab active" onclick="switchTab('login')">登录</div>
    <div class="tab" onclick="switchTab('register')">注册</div>
  </div>
  <div id="loginForm">
    <div class="form-group"><label>邮箱</label><input id="loginEmail" type="text" placeholder="your@email.com" autocomplete="email" /></div>
    <div class="form-group">
      <label>密码</label><input id="loginPassword" type="password" placeholder="密码" autocomplete="current-password" />
      <div class="row-help"><a href="/forgot">忘记密码？</a></div>
    </div>
    <div class="error" id="loginError"></div>
    <button class="btn" onclick="doLogin()">登录</button>
  </div>
  <div id="registerForm" style="display:none">
    <div class="form-group"><label>邮箱</label><input id="regEmail" type="email" placeholder="your@email.com" autocomplete="email" />
      <div class="field-hint">用于登录和找回密码，请填常用邮箱</div></div>
    <div class="form-group"><label>密码</label><input id="regPassword" type="password" placeholder="至少6位" autocomplete="new-password" /></div>
    <div class="form-group"><label>显示名（可选）</label><input id="regDisplayName" type="text" placeholder="只用于界面显示，不作登录用" /></div>
    <div class="form-group"><label>联系方式（可选）</label><input id="regContact" type="text" placeholder="微信号或手机号" /></div>
    <div class="error" id="regError"></div>
    <button class="btn" onclick="doRegister()">注册</button>
  </div>
  <div class="footer"><a href="/">← 返回主页</a></div>
</div>
<script>
function switchTab(tab){
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',(tab==='login'&&i===0)||(tab==='register'&&i===1)));
  document.getElementById('loginForm').style.display=tab==='login'?'block':'none';
  document.getElementById('registerForm').style.display=tab==='register'?'block':'none';
  document.getElementById('loginError').style.display='none';
  document.getElementById('regError').style.display='none';
}
// —— 登录后落点 ——
// 1) 带 ?next= 时回原页（只接受站内路径，防开放重定向）；2) 否则按角色：
//    platform=平台方 → /platform；user=普通用户 → /admin（各自的后台）
function nextTarget(){
  const raw=new URLSearchParams(location.search).get('next')||'';
  if(!/^\/[A-Za-z0-9][A-Za-z0-9\-._~\/?=&%]*$/.test(raw))return '';
  if(/^\/(login|forgot|reset)(\/|$|\?)/.test(raw))return '';
  return raw;
}
function landingAfter(role){return nextTarget()||(role==='platform'?'/platform':'/admin')}

async function doLogin(){
  const email=document.getElementById('loginEmail').value.trim();
  const password=document.getElementById('loginPassword').value;
  const err=document.getElementById('loginError');
  err.style.display='none';
  if(!email||!password){err.textContent='请填写邮箱和密码';err.style.display='block';return}
  const btn=document.querySelector('#loginForm .btn');btn.disabled=true;btn.textContent='登录中...';
  try{
    const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password})});
    const d=await r.json();
    if(d.error){err.textContent=d.error;err.style.display='block'}
    else{location.href=landingAfter(d.role)}
  }catch(e){err.textContent='网络错误';err.style.display='block'}
  finally{btn.disabled=false;btn.textContent='登录'}
}
async function doRegister(){
  const email=document.getElementById('regEmail').value.trim();
  const password=document.getElementById('regPassword').value;
  const display_name=document.getElementById('regDisplayName').value.trim();
  const contact=document.getElementById('regContact').value.trim();
  const err=document.getElementById('regError');
  err.style.display='none';
  if(!email||!password){err.textContent='请填写邮箱和密码';err.style.display='block';return}
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){err.textContent='请填写有效的邮箱地址';err.style.display='block';return}
  if(password.length<6){err.textContent='密码至少6位';err.style.display='block';return}
  const btn=document.querySelector('#registerForm .btn');btn.disabled=true;btn.textContent='注册中...';
  try{
    const r=await fetch('/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password,display_name,contact})});
    const d=await r.json();
    if(d.error){err.textContent=d.error;err.style.display='block'}
    else{location.href=nextTarget()||'/admin'}
  }catch(e){err.textContent='网络错误';err.style.display='block'}
  finally{btn.disabled=false;btn.textContent='注册'}
}
document.getElementById('loginPassword').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()});
document.getElementById('regPassword').addEventListener('keydown',e=>{if(e.key==='Enter')doRegister()});
</script>
</body>
</html>
