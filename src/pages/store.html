<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>商店 — Shademark</title>
<link rel="icon" href="/logo.png" type="image/png">
<style>
:root{--bg:#0d0d0f;--card:#17171b;--border:#2a2a33;--text:#e8e8ea;--muted:#8a8a94;--accent:#7c6cf0;--danger:#f87171;--success:#4ade80}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;overflow-x:hidden}
.nav{height:60px;border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 24px;gap:24px;background:var(--bg)}
.nav .brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text);flex-shrink:0}
.nav .brand img{width:32px;height:32px;object-fit:contain;border-radius:8px}
.nav .brand span{font-size:15px;font-weight:700;letter-spacing:-0.02em}
.nav-tools{display:flex;gap:4px;align-items:center}
.nav-tools a{color:var(--muted);text-decoration:none;font-size:14px;font-weight:500;padding:7px 12px;border-radius:6px;transition:color .2s,background .2s;white-space:nowrap}
.nav-tools a:hover{color:var(--text);background:#141419}
.home-link{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border:1px solid var(--border);border-radius:6px;color:var(--muted);text-decoration:none;font-size:13px;font-weight:600;white-space:nowrap;transition:all .2s;margin-left:auto}
.home-link:hover{color:var(--text);border-color:var(--accent)}
.main{max-width:960px;margin:0 auto;padding:clamp(24px,4vh,40px) 24px;min-height:calc(100vh - 60px)}
.main h1{font-size:24px;font-weight:700;margin-bottom:6px}
.main .subtitle{color:var(--muted);font-size:14px;margin-bottom:clamp(20px,4vh,32px)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:24px;display:flex;flex-direction:column;transition:border-color .2s,transform .2s}
.card:hover{border-color:var(--accent);transform:translateY(-2px)}
.card h3{font-size:16px;font-weight:600;margin-bottom:8px}
.card .desc{color:var(--muted);font-size:13px;line-height:1.55;margin-bottom:16px;min-height:38px;flex:1;white-space:pre-wrap}
.card .price{font-size:22px;font-weight:700;margin-bottom:16px}
.card .price span{font-size:13px;color:var(--muted);font-weight:400}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:10px 18px;border-radius:6px;border:none;font-size:14px;font-weight:600;cursor:pointer;text-decoration:none;transition:all .2s}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{opacity:.88}
.btn-full{width:100%}
.empty{text-align:center;padding:60px 0;color:var(--muted);font-size:14px}
@media(max-width:600px){.nav{padding:0 16px;gap:8px}.nav-tools{display:none}.main{padding:24px 16px}.main h1{font-size:20px}.grid{grid-template-columns:1fr;gap:12px}.card{padding:20px}}
</style>
</head>
<body>
<nav class="nav">
  <a href="/" class="brand"><img src="/logo.png" alt="Logo"><span>Shademark</span></a>
  <div class="nav-tools">
    <a href="/">主页</a><a href="/quote">报价单</a><a href="/watermark">水印</a><a href="/compress">压缩</a><a href="/admin">发码</a><a href="/links">短链</a>
  </div>
</nav>
<div class="main">
  <h1>商店</h1>
  <p class="subtitle">预览在售商品，点击查看详情后下单</p>
  <div class="grid" id="productGrid"></div>
  <div class="empty" id="emptyState" style="display:none">暂无在售商品</div>
</div>
<script>
async function loadProducts(){
  try{
    const r=await fetch('/api/store/products');const d=await r.json();
    const grid=document.getElementById('productGrid');const empty=document.getElementById('emptyState');
    if(!d.products||!d.products.length){grid.innerHTML='';empty.style.display='block';return}
    empty.style.display='none';
    grid.innerHTML=d.products.map(p=>`
      <div class="card">
        <h3>${esc(p.name)}</h3>
        <p class="desc">${esc(p.description||'暂无描述')}</p>
        <div class="price">¥${(p.price/100).toFixed(2)}<span> / 个</span></div>
        <a class="btn btn-primary btn-full" href="/store/${esc(p.id)}">查看详情</a>
      </div>`).join('');
  }catch(e){document.getElementById('productGrid').innerHTML='<div class="empty">加载失败</div>'}
}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
loadProducts();
</script>
</body>
</html>
