<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>短链工具 — ShadeMark</title>
<link rel="icon" href="/favicon.png" type="image/png">
<style>
:root{--bg:#0d0d0f;--card:#17171b;--border:#2a2a33;--text:#e8e8ea;--muted:#8a8a94;--accent:#7c6cf0;--danger:#f87171;--success:#4ade80;--warn:#ffd166;--info:#60a5fa}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh}
.nav{height:60px;border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 24px;gap:24px;background:var(--bg)}
.nav .brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text);flex-shrink:0}
.nav .brand img{width:32px;height:32px;object-fit:contain;border-radius:8px}
.nav .brand span{font-size:16px;font-weight:700;letter-spacing:-0.02em}
.nav-tools{display:flex;gap:4px;align-items:center}
.nav-tools a{color:var(--muted);text-decoration:none;font-size:14px;font-weight:500;padding:7px 12px;border-radius:6px;transition:color .2s,background .2s;white-space:nowrap}
.nav-tools a:hover{color:var(--text);background:#141419}
.nav-links{display:flex;gap:12px;align-items:center;margin-left:auto}
.nav-links a{color:var(--muted);text-decoration:none;font-size:14px;font-weight:500;transition:color .2s}
.nav-links a:hover{color:var(--text)}
.home-link{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border:1px solid var(--border);border-radius:6px;color:var(--muted);text-decoration:none;font-size:13px;font-weight:600;white-space:nowrap;transition:all .2s}
.home-link:hover{color:var(--text);border-color:var(--accent)}
.main{max-width:1100px;margin:0 auto;padding:clamp(24px,4vh,40px) 24px}
h1{font-size:24px;font-weight:700;margin-bottom:6px}
.subtitle{color:var(--muted);font-size:14px;margin-bottom:clamp(20px,4vh,28px)}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px 24px;margin-bottom:20px}
.card h2{font-size:16px;font-weight:600;margin-bottom:14px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.field{flex:1;min-width:220px}
.field.narrow{flex:0 0 220px;min-width:180px}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:600}
input{width:100%;padding:10px 12px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:14px;outline:none}
input:focus{border-color:var(--accent)}
.btn{padding:10px 18px;border-radius:6px;border:none;font-size:14px;font-weight:600;cursor:pointer;transition:all .2s;white-space:nowrap}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{opacity:.88}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text)}
.btn-danger{background:#5c2020;color:var(--danger)}
.btn-sm{padding:6px 10px;font-size:12px}
.hint{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.5}
/* Pro 到期宽限期提示（到期后 3 天内权益保留，只提示续费） */
.grace-bar{display:none;align-items:center;gap:10px;flex-wrap:wrap;background:#1a1710;border:1px solid rgba(255,209,102,.45);border-radius:10px;padding:12px 16px;margin-bottom:16px;font-size:13px;color:var(--muted);line-height:1.6}
.grace-bar .warn{color:var(--warn);font-weight:600}
.grace-bar .renew{margin-left:auto;color:var(--warn);font-weight:700;text-decoration:underline;text-underline-offset:3px;white-space:nowrap}
/* —— 页面角落：当前权益两行（固定不滚动，与发码页同一位置） —— */
.plan-foot{position:fixed;right:16px;bottom:14px;z-index:40;max-width:calc(100vw - 32px);
  font-size:12px;line-height:1.5;color:var(--muted);font-variant-numeric:tabular-nums;
  background:rgba(13,13,15,.88);border:1px solid var(--border);border-radius:10px;padding:8px 12px;
  backdrop-filter:blur(6px);pointer-events:none}
.plan-foot .pf-line{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.plan-foot .pf-line+.pf-line{margin-top:2px}
.plan-foot b{color:var(--text);font-weight:600}
.plan-foot .pf-tier{font-weight:600}
.plan-foot.warn{color:var(--warn);border-color:rgba(255,209,102,.45);background:rgba(26,23,16,.94)}
.plan-foot.warn b{color:var(--warn)}
@media(max-width:600px){.plan-foot{position:static;margin:16px 0 0;border-radius:10px;white-space:normal;line-height:1.6}}
/* —— 右上角账号菜单 —— */
.acct{position:relative;display:inline-flex;align-items:center}
.acct-btn{display:inline-flex;align-items:center;gap:6px;background:none;border:none;cursor:pointer;color:var(--muted);
  font-size:13px;font-weight:500;font-family:inherit;padding:4px 2px;max-width:200px}
.acct-btn:hover{color:var(--text)}
.acct-btn .caret{width:8px;height:8px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(45deg);margin-top:-3px;flex-shrink:0}
.acct-menu{display:none;position:absolute;right:0;top:calc(100% + 12px);min-width:168px;background:var(--card);border:1px solid var(--border);
  border-radius:10px;padding:6px;box-shadow:0 16px 40px rgba(0,0,0,.5);z-index:120}
.acct-menu.show{display:block}
.acct-menu a,.acct-menu button{display:block;width:100%;text-align:left;padding:9px 12px;border-radius:6px;color:var(--text);
  text-decoration:none;font-size:13px;font-weight:500;background:none;border:none;cursor:pointer;font-family:inherit;white-space:nowrap}
.acct-menu a:hover,.acct-menu button:hover{background:#1e1e28}
.acct-menu .sep{height:1px;background:var(--border);margin:6px 4px}
.acct-menu .danger{color:var(--danger)}
.usage{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.usage-bar{flex:1;min-width:180px;height:6px;background:var(--bg);border-radius:3px;overflow:hidden;border:1px solid var(--border)}
.usage-fill{height:100%;background:var(--accent);transition:width .3s}
.usage-text{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.usage-text b{color:var(--text)}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:760px}
th,td{text-align:left;padding:12px 10px;border-bottom:1px solid var(--border)}
th{color:var(--muted);font-size:12px;font-weight:500}
tr:hover td{background:#14141a}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.short{color:var(--accent);font-size:13px}
.ops{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.ops .btn{flex:1 1 auto;white-space:nowrap}
.target{color:var(--muted);font-size:12px;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{display:inline-block;padding:3px 8px;border-radius:4px;font-size:12px}
.badge-on{background:#2a3a35;color:var(--success)}
.badge-off{background:#3a2a2a;color:var(--danger)}
.badge-pro{background:#2a2440;color:var(--accent)}
.badge-free{background:#22222a;color:var(--muted)}
.spark{display:flex;align-items:flex-end;gap:3px;height:28px}
.spark i{flex:1;min-width:4px;background:#2f2f3d;border-radius:2px 2px 0 0;display:block}
.spark i.has{background:var(--accent)}
.src{font-size:12px;color:var(--muted);line-height:1.6}
.src b{color:var(--text);font-weight:600}
.empty{text-align:center;padding:56px 0;color:var(--muted);font-size:14px}
.modal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);z-index:100;align-items:center;justify-content:center;padding:16px}
.modal.active{display:flex}
.modal-content{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:24px;max-width:640px;width:100%;max-height:80vh;overflow-y:auto}
.modal-content h2{font-size:18px;font-weight:700;margin-bottom:6px}
.contact-modal .cm-sub{color:var(--muted);font-size:12px;line-height:1.6;margin:2px 0 14px}
.contact-modal .cm-err{color:var(--danger);font-size:13px;line-height:1.5;margin:-4px 0 6px;display:none}
.contact-modal .cm-actions{display:flex;gap:10px;margin-top:2px}
.contact-modal .cm-actions .btn{flex:1 1 0;min-height:44px;padding:10px 12px;box-sizing:border-box;white-space:nowrap}
.contact-modal .modal-content input,.contact-modal .modal-content select,.contact-modal .modal-content textarea{min-height:44px;box-sizing:border-box}
.contact-modal .modal-content textarea{min-height:96px}
@media(max-width:600px){
  .contact-modal .modal-content{margin:6px;width:92%;padding:20px}
  .contact-modal .cm-actions .btn{min-height:44px}
}
.dist{display:flex;gap:10px;margin:14px 0;flex-wrap:wrap}
.dist-item{flex:1;min-width:110px;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:10px 12px}
.dist-item .k{font-size:12px;color:var(--muted);margin-bottom:4px}
.dist-item .v{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--bg);border-radius:3px;overflow:hidden;margin-top:8px;border:1px solid var(--border)}
.bar span{display:block;height:100%;background:var(--accent)}
.timeline{max-height:280px;overflow-y:auto;margin-top:6px}
.tl-row{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px;align-items:baseline}
.tl-time{color:var(--muted);font-variant-numeric:tabular-nums;flex:0 0 128px;font-size:12px}
.tl-src{flex:0 0 72px}
.tl-dev{flex:0 0 56px;color:var(--muted)}
.tl-ref{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.close-row{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
#toast{position:fixed;left:50%;bottom:32px;transform:translateX(-50%);background:var(--card);border:1px solid var(--border);border-radius:8px;padding:10px 18px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:200}
#toast.show{opacity:1}
/* —— 通用确认 / 提示弹窗（替代原生 confirm/alert，兼容安卓各浏览器） —— */
.sd-mask{display:none;position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:300;align-items:center;justify-content:center;padding:20px}
.sd-mask.show{display:flex}
.sd-dialog{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:22px;width:100%;max-width:360px;box-shadow:0 18px 60px rgba(0,0,0,.5)}
.sd-title{font-size:15px;font-weight:700;margin-bottom:10px}
.sd-msg{font-size:14px;color:var(--muted);line-height:1.6;white-space:pre-wrap;word-break:break-word}
.sd-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;flex-wrap:wrap}
.sd-actions .btn{min-height:42px;padding:9px 14px;flex:1 1 auto;min-width:96px}
@media(max-width:600px){
  .nav{padding:0 16px;gap:8px;position:sticky;top:0;z-index:50}
  .nav-tools{display:none}
  .nav .brand span{font-size:16px}
  .nav-links{gap:14px;overflow-x:auto;scrollbar-width:none}
  .nav-links::-webkit-scrollbar{display:none}
  .nav-links a{white-space:nowrap;font-size:13px}
  .main{padding:20px 16px}
  h1{font-size:20px}
  .card{padding:18px}
  .field.narrow{flex:1;min-width:0}
  .row{gap:10px}
  .usage-bar{min-width:100%}
  .btn{min-height:42px}
  .btn-sm{min-height:38px}
  .ops{gap:6px}
  .ops .btn{flex:1 1 44%;min-width:0}
  table{min-width:720px}
}
@media(max-width:400px){.subtitle{font-size:13px}}
/* 窄屏：表格行转为卡片式，去掉横向滚动 */
@media(max-width:820px){
  .table-wrap{overflow:visible}
  table{min-width:0;display:block;width:100%}
  thead{display:none}
  tbody{display:block}
  tbody tr{display:block;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:12px}
  tbody tr:hover td{background:transparent}
  tbody td{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:7px 0;border-bottom:1px dashed var(--border);font-size:13px}
  tbody td:last-child{border-bottom:none}
  tbody td::before{content:attr(data-label);color:var(--muted);font-size:12px;font-weight:600;flex:0 0 auto;margin-right:12px}
  tbody td.l-main{display:block}
  tbody td.l-main::before{content:''}
  tbody td.l-main .short{font-size:15px;margin-bottom:4px}
  tbody td.l-main .target{max-width:100%;white-space:normal;word-break:break-all;line-height:1.4}
  tbody td .spark{height:26px}
  tbody td.l-ops{display:block}
  tbody td.l-ops::before{content:''}
  tbody td.l-ops .ops{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
  tbody td.l-ops .ops .btn{width:100%}
}

</style>
</head>
<body>
<nav class="nav">
  <a href="/" class="brand"><img src="/logo.png" alt="ShadeMark"><span>ShadeMark</span></a>
  <div class="nav-tools">
    <a href="/">主页</a><a href="/quote">报价单</a><a href="/watermark">水印</a><a href="/compress">压缩</a><a href="/admin">发码</a><a href="/links">短链</a>
  </div>
  <div class="nav-links">
    <a href="/login" id="navLogin" style="display:none">登录</a>
    <span class="acct" id="navAcct" style="display:none">
      <button class="acct-btn" id="acctBtn" onclick="toggleAcct(event)" aria-haspopup="true" aria-expanded="false" title="账号菜单">
        <span id="navUser"></span><i class="caret"></i>
      </button>
      <div class="acct-menu" id="acctMenu">
        <a href="/admin?sub=1&from=links">订阅</a>
        <a href="/admin">发码后台</a>
        <div class="sep"></div>
        <button class="danger" onclick="logout()">退出登录</button>
      </div>
    </span>
    <a href="javascript:void(0)" id="navContact" onclick="openContact('other')" style="display:none">联系</a>
  </div>
</nav>

<div class="main">
  <h1>短链工具</h1>
  <div class="subtitle">生成带访问统计的短链接，知道谁点了、从哪点的、点了几次。</div>

  <div class="grace-bar" id="graceBar"></div>

  <div class="card">
    <h2>创建短链接</h2>
    <div class="row">
      <div class="field"><label>目标长链接</label><input id="targetUrl" placeholder="https://example.com/very/long/path" /></div>
      <div class="field narrow"><label>自定义后缀（可选）</label><input id="customSlug" placeholder="abc123" /></div>
      <button class="btn btn-primary" onclick="createLink()">生成短链</button>
    </div>
    <div class="hint">后缀 3–32 位，仅限字母、数字、连字符；留空则自动生成 6 位短码。</div>
  </div>

  <div class="card" style="padding:0;border-radius:12px;overflow:hidden">
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th style="min-width:170px">短链</th><th>点击量</th><th style="min-width:110px">最近 7 天</th>
          <th style="min-width:150px">来源</th><th style="width:70px">状态</th><th style="min-width:180px">操作</th>
        </tr></thead>
        <tbody id="linkTable"></tbody>
      </table>
    </div>
    <div class="empty" id="emptyState" style="display:none">还没有短链接，上面创建一条。</div>
  </div>

  <!-- 页面角落：当前权益（与发码页同一位置，极轻一行） -->
  <div class="plan-foot" id="planFoot" style="display:none"></div>
</div>

<div class="modal" id="detailModal">
  <div class="modal-content">
    <h2 id="detailTitle">点击详情</h2>
    <div class="subtitle mono" id="detailSub" style="margin-bottom:0"></div>
    <div class="dist" id="detailDist"></div>
    <h2 style="font-size:14px;margin-top:20px">最近 50 次点击</h2>
    <div class="timeline" id="detailTimeline"></div>
    <div class="close-row">
      <span class="hint" id="csvHint" style="margin-right:auto"></span>
      <button class="btn btn-ghost" id="csvBtn">导出 CSV</button>
      <button class="btn btn-ghost" onclick="closeDetail()">关闭</button>
    </div>
  </div>
</div>

<div class="modal" id="loginModal">
  <div class="modal-content" style="max-width:400px">
    <h2>登录后使用</h2>
    <div class="subtitle">短链接需要归属到账号，登录后才能查看统计。</div>
    <div class="field" style="margin-bottom:12px"><label>邮箱</label><input id="loginEmail" type="email" placeholder="you@example.com" /></div>
    <div class="field" style="margin-bottom:16px"><label>密码</label><input id="loginPwd" type="password" placeholder="至少 8 位" /></div>
    <div class="row" style="gap:10px">
      <button class="btn btn-primary" style="flex:1" onclick="doLogin()">登录</button>
      <button class="btn btn-ghost" onclick="location.href='/login'">去注册</button>
    </div>
    <div class="hint" id="loginErr" style="color:var(--danger);display:none"></div>
  </div>
</div>

<div class="modal contact-modal" id="contactModal">
  <div class="modal-content" style="max-width:460px">
    <h2>联系平台方</h2>
    <div class="cm-sub">有什么需求或问题，提交后平台方会尽快回复。</div>
    <div class="field" style="margin-bottom:12px"><label>联系方式 <span style="color:var(--danger)">*</span></label><input id="cm_email" type="text" placeholder="建议填写邮箱或微信号，用于平台方联系你" /></div>
    <div class="field" style="margin-bottom:12px"><label>类型 <span style="color:var(--danger)">*</span></label>
      <select id="cm_type" style="width:100%;padding:10px 12px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:14px;outline:none">
        <option value="upgrade">升级 Pro</option>
        <option value="technical">技术问题</option>
        <option value="other">其他</option>
      </select>
    </div>
    <div class="field" style="margin-bottom:12px"><label>留言 <span style="color:var(--danger)">*</span></label><textarea id="cm_message" rows="4" style="width:100%;padding:10px 12px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:14px;outline:none;resize:vertical;box-sizing:border-box" placeholder="请描述你的需求或问题"></textarea></div>
    <div class="cm-err" id="cm_err"></div>
    <div class="cm-actions">
      <button class="btn btn-primary cm-submit" onclick="submitContact()">提交</button>
      <button class="btn btn-ghost" onclick="closeContact()">取消</button>
    </div>
  </div>
</div>

<div class="sd-mask" id="sdMask">
  <div class="sd-dialog">
    <div class="sd-title" id="sdTitle"></div>
    <div class="sd-msg" id="sdMsg"></div>
    <div class="sd-actions" id="sdActions"></div>
  </div>
</div>
<div id="toast"></div>

<script>
const DATA = {
  links: [],
  usage: { used: 0, limit: 10000, month: '', tier: 'free', retention_days: 30, can_export_csv: false, ever_pro: false },
  tier: 'free',
  canExport: false,
  detailId: '',
  sub: null,        // /api/auth/session 返回的订阅快照（含宽限期字段）
};

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._timer); t._timer = setTimeout(() => t.classList.remove('show'), 1800);
}

/* —— 联系表单（与各页共用组件逻辑）—— */
let CM_SENDING = false;
function openContact(type) {
  const modal = document.getElementById('contactModal');
  const sel = document.getElementById('cm_type');
  const setType = type || 'other';
  if (['upgrade', 'technical', 'other'].includes(setType)) sel.value = setType;
  const err = document.getElementById('cm_err'); err.style.display = 'none';
  document.getElementById('cm_message').value = '';
  const email = document.getElementById('cm_email');
  email.value = ''; email.disabled = false;
  modal.classList.add('active');
  setTimeout(() => email.focus(), 50);
}
function closeContact() {
  const modal = document.getElementById('contactModal');
  if (modal) modal.classList.remove('active');
  const err = document.getElementById('cm_err'); if (err) err.style.display = 'none';
  CM_SENDING = false;
}
async function submitContact() {
  if (CM_SENDING) return;
  const contact = document.getElementById('cm_email').value.trim();
  const type = document.getElementById('cm_type').value;
  const message = document.getElementById('cm_message').value.trim();
  const err = document.getElementById('cm_err');
  // 联系方式支持邮箱或微信号（自由文本），仅要求非空
  if (!contact) { err.textContent = '请填写联系方式（邮箱或微信号）'; err.style.display = 'block'; return; }
  if (contact.length > 200) { err.textContent = '联系方式过长'; err.style.display = 'block'; return; }
  if (!message) { err.textContent = '请填写留言内容'; err.style.display = 'block'; return; }
  CM_SENDING = true;
  const submitBtn = document.querySelector('#contactModal .cm-submit');
  const oldTxt = submitBtn.textContent; submitBtn.textContent = '提交中…'; submitBtn.disabled = true;
  try {
    const r = await fetch('/api/contact', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email: contact, type, message }) });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) { err.textContent = d.error || '提交失败，请稍后再试'; err.style.display = 'block'; return; }
    closeContact();
    toast('已收到，会尽快回复');
  } catch (e) {
    err.textContent = '网络错误，请稍后再试'; err.style.display = 'block';
  } finally {
    CM_SENDING = false; submitBtn.textContent = oldTxt; submitBtn.disabled = false;
  }
}
/* —— 统一确认 / 提示弹窗（安卓内置浏览器原生 confirm/alert 常被拦截，改用 DOM 弹窗） —— */
function sdOpen(title, msg, actions) {
  const mask = document.getElementById('sdMask');
  document.getElementById('sdTitle').textContent = title;
  document.getElementById('sdMsg').textContent = msg;
  const box = document.getElementById('sdActions');
  box.innerHTML = '';
  actions.forEach(a => {
    const b = document.createElement('button');
    b.className = 'btn ' + (a.cls || 'btn-ghost');
    b.textContent = a.label;
    b.onclick = () => { sdClose(); a.onOk && a.onOk(); };
    box.appendChild(b);
  });
  mask.classList.add('show');
}
function sdClose() { document.getElementById('sdMask').classList.remove('show'); }
function sdConfirm(msg, onOk) {
  sdOpen('请确认', msg, [
    { label: '取消', cls: 'btn-ghost', onOk: null },
    { label: '确定', cls: 'btn-danger', onOk },
  ]);
}
function sdAlert(msg, title) {
  sdOpen(title || '提示', msg, [{ label: '知道了', cls: 'btn-ghost', onOk: null }]);
}
document.getElementById('sdMask').addEventListener('click', (e) => { if (e.target.id === 'sdMask') sdClose(); });
function shortUrl(slug) { return location.origin + '/l/' + slug; }
async function copy(text) {
  try { await navigator.clipboard.writeText(text); }
  catch (e) {
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); ta.remove();
  }
  toast('已复制 ' + text);
}
function fmtTime(ts) {
  const d = new Date(ts * 1000);
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function fmtDateY(ts) {
  if (!ts) return '永久';
  const d = new Date(Number(ts) * 1000);
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
}
function fmtDateMD(ts) {
  if (!ts) return '—';
  const d = new Date(Number(ts) * 1000);
  return `${d.getMonth()+1} 月 ${d.getDate()} 日`;
}
function sparkline(trend) {
  const max = Math.max(1, ...trend.map(t => t.count));
  return '<div class="spark">' + trend.map(t => {
    const h = t.count ? Math.max(3, Math.round(t.count / max * 28)) : 2;
    return `<i class="${t.count ? 'has' : ''}" style="height:${h}px" title="${t.day} · ${t.count}"></i>`;
  }).join('') + '</div>';
}
function srcLabel(s) {
  return `<b>${s.direct}</b> 直接 · <b>${s.social}</b> 社交 · <b>${s.external}</b> 外链`;
}

async function checkAuth() {
  const r = await fetch('/api/auth/session');
  const d = await r.json();
  if (!d.authenticated) {
    document.getElementById('loginModal').classList.add('active');
    document.getElementById('navLogin').style.display = '';
    document.getElementById('navContact').style.display = 'none';
    document.getElementById('navAcct').style.display = 'none';
    return false;
  }
  document.getElementById('navLogin').style.display = 'none';
  document.getElementById('navContact').style.display = '';
  document.getElementById('navAcct').style.display = '';
  const u = document.getElementById('navUser');
  DATA.sub = d.subscription || null;
  const tier = d.subscription?.tier || d.user.subscription_tier || 'free';
  u.innerHTML = esc(d.user.email) + (tier === 'pro'
    ? ' <span class="badge badge-pro" style="margin-left:6px">Pro</span>'
    : ' <span class="badge badge-free" style="margin-left:6px">Free</span>');
  return true;
}

// —— 右上角账号菜单（用户名 → 订阅 / 发码后台 / 退出登录）——
function toggleAcct(e) {
  if (e) e.stopPropagation();
  const m = document.getElementById('acctMenu');
  const b = document.getElementById('acctBtn');
  const open = m.classList.toggle('show');
  if (b) b.setAttribute('aria-expanded', open ? 'true' : 'false');
}
document.addEventListener('click', () => {
  const m = document.getElementById('acctMenu'), b = document.getElementById('acctBtn');
  if (m && m.classList.contains('show')) { m.classList.remove('show'); if (b) b.setAttribute('aria-expanded', 'false'); }
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && window.toggleAcct) toggleAcct(); });

async function logout() {
  try { await fetch('/api/auth/logout', { method: 'POST' }); } catch (e) {}
  location.href = '/';
}

async function load() {
  const r = await fetch('/api/links');
  const d = await r.json();
  if (d.error) return;
  DATA.links = d.links || [];
  DATA.usage = d.usage || DATA.usage;
  DATA.tier = d.usage?.tier || DATA.tier;
  renderUsage();
  renderTable();
}

function renderUsage() {
  renderGraceBar();
  renderPlanFoot();
}

// 页面角落：当前权益两行（第一行会员到期 / 第二行权益），Free / Pro / 宽限 / 超额 四态。
// 超额时先说「链接照常跳转」再说额度 —— 用户最怕的是链接断了。
function renderPlanFoot() {
  const el = document.getElementById('planFoot');
  if (!el) return;
  const u = DATA.usage;
  if (!u || !u.month) { el.style.display = 'none'; return; }
  const isPro = u.tier === 'pro';
  const ret = u.retention_days || (isPro ? 90 : 30);
  const sub = DATA.sub;
  el.style.display = '';

  // 第一行：会员到期（Pro 正常 / Pro 宽限 / Free）
  let line1 = '';
  if (sub && sub.in_grace) {
    line1 = `<b class="pf-tier">Pro</b><span>已到期，宽限至 ${fmtDateMD(sub.grace_ends_at || sub.expires_at)}</span>`;
  } else if (isPro) {
    line1 = `<b class="pf-tier">Pro</b><span>${sub && sub.expires_at ? `到期时间 ${fmtDateY(sub.expires_at)}（剩 ${sub.days_left} 天）` : '不限期'}</span>`;
  } else {
    line1 = `<b class="pf-tier">Free</b>`;
  }

  // 第二行：权益（超额先说核心功能没断，再说额度）
  let line2 = '';
  let warn = false;
  if (u.limit > 0 && u.used >= u.limit) {
    warn = true;
    line2 = `<b>链接照常跳转，统计已暂停</b><span>本月点击已超额，下月 1 日恢复记录。</span>`;
  } else if (isPro) {
    line2 = `<span>本月点击 ${u.used.toLocaleString()} · 统计保留 ${ret} 天 · CSV 导出</span>`;
  } else {
    const retNote = (!isPro && u.ever_pro) ? '（曾为 Pro，按 90 天保留）' : '';
    line2 = `<span>本月点击 ${u.used.toLocaleString()}/${u.limit.toLocaleString()} · 统计保留 ${ret} 天${retNote}</span>`;
  }

  el.className = 'plan-foot' + (warn ? ' warn' : '');
  el.innerHTML = `<div class="pf-line">${line1}</div><div class="pf-line">${line2}</div>`;
}

// Pro 到期宽限期提示：到期后 3 天内权益照常，只提示续费
function renderGraceBar() {
  const bar = document.getElementById('graceBar');
  if (!bar) return;
  const sub = DATA.sub;
  if (sub && sub.in_grace) {
    bar.innerHTML = `<span class="warn">Pro 已到期，宽限期还剩 ${sub.grace_days_left} 天</span>` +
      `<span>期间权益照常；宽限期结束后自动降为免费版，已创建的链接与统计数据不会被删除，续费即全部恢复。</span>` +
      `<span class="renew" onclick="location.href='/admin?sub=1&from=links'">去续费</span>`;
    bar.style.display = 'flex';
  } else {
    bar.style.display = 'none';
  }
}

function renderTable() {
  const tbody = document.getElementById('linkTable');
  const empty = document.getElementById('emptyState');
  if (!DATA.links.length) { tbody.innerHTML = ''; empty.style.display = 'block'; return; }
  empty.style.display = 'none';
  tbody.innerHTML = DATA.links.map(l => `
    <tr>
      <td data-label="短链" class="l-main">
        <div class="short mono">/l/${esc(l.slug)}</div>
        <div class="target" title="${esc(l.target_url)}">${esc(l.target_url)}</div>
      </td>
      <td data-label="点击量" class="mono" style="font-size:16px;font-weight:700">${l.clicks}</td>
      <td data-label="最近 7 天">${sparkline(l.trend || defaultTrend())}</td>
      <td data-label="来源" class="src">${l.sources ? srcLabel(l.sources) : '<span style="opacity:.5">—</span>'}</td>
      <td data-label="状态"><span class="badge ${l.is_active ? 'badge-on' : 'badge-off'}">${l.is_active ? '启用' : '停用'}</span></td>
      <td data-label="操作" class="l-ops">
        <div class="ops">
          <button class="btn btn-ghost btn-sm" onclick="copy('${shortUrl(l.slug)}')">复制</button>
          <button class="btn btn-ghost btn-sm" onclick="openDetail('${l.id}')">详情</button>
          <button class="btn btn-ghost btn-sm" onclick="toggleLink('${l.id}',${l.is_active ? 0 : 1})">${l.is_active ? '停用' : '启用'}</button>
          <button class="btn btn-danger btn-sm" onclick="removeLink('${l.id}')">删除</button>
        </div>
      </td>
    </tr>`).join('');
}

function defaultTrend() {
  return [0,1,2,3,4,5,6].map(i => ({ day: '-', count: 0 }));
}

async function createLink() {
  const target = document.getElementById('targetUrl').value.trim();
  const slug = document.getElementById('customSlug').value.trim();
  if (!target) return toast('请填写目标链接');
  const r = await fetch('/api/links', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ target_url: target, slug: slug || undefined })
  });
  const d = await r.json();
  if (d.error) return toast(d.error);
  document.getElementById('targetUrl').value = '';
  document.getElementById('customSlug').value = '';
  copy(d.short_url);
  load();
}

async function toggleLink(id, isActive) {
  const r = await fetch('/api/links', {
    method: 'PUT', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ id, is_active: isActive })
  });
  const d = await r.json();
  if (d.error) return toast(d.error);
  toast(isActive ? '已启用' : '已停用');
  load();
}

function removeLink(id) {
  sdConfirm('删除后该链接立即失效，统计数据一并清除。确认删除？', () => doRemove(id));
}
async function doRemove(id) {
  const r = await fetch('/api/links?id=' + id, { method: 'DELETE' });
  const d = await r.json();
  if (d.error) return sdAlert(d.error);
  load();
}

async function openDetail(id) {
  const r = await fetch('/api/links/stats?id=' + id);
  const d = await r.json();
  if (d.error) return toast(d.error);
  const s = d.stats;
  document.getElementById('detailTitle').textContent = '/l/' + d.link.slug;
  document.getElementById('detailSub').textContent = d.link.target_url;
  const total = Math.max(1, s.total);
  const pct = n => Math.round(n / total * 100);
  document.getElementById('detailDist').innerHTML = `
    <div class="dist-item"><div class="k">总点击</div><div class="v">${s.total}</div></div>
    <div class="dist-item"><div class="k">直接 / 社交 / 外链</div><div class="v" style="font-size:14px">${s.sources.direct} / ${s.sources.social} / ${s.sources.external}</div>
      <div class="bar"><span style="width:${pct(s.sources.direct)}%"></span></div></div>
    <div class="dist-item"><div class="k">移动 / 桌面 / 其他</div><div class="v" style="font-size:14px">${s.devices.mobile} / ${s.devices.desktop} / ${s.devices.other}</div>
      <div class="bar"><span style="width:${pct(s.devices.mobile)}%"></span></div></div>`;
  const srcName = { direct: '直接', social: '社交', external: '外链' };
  const devName = { mobile: '移动', desktop: '桌面', other: '其他' };
  document.getElementById('detailTimeline').innerHTML = s.recent.length
    ? s.recent.map(c => `<div class="tl-row">
        <span class="tl-time">${fmtTime(c.clicked_at)}</span>
        <span class="tl-src">${srcName[c.source]}</span>
        <span class="tl-dev">${devName[c.device]}</span>
        <span class="tl-ref">${esc(c.referer || (c.country || '—'))}</span>
      </div>`).join('')
    : '<div class="empty" style="padding:24px 0">还没有点击记录</div>';
  // CSV 导出是 Pro 独占：Free 用户不显示入口（也不推销），Pro 直接下载
  const canCsv = !!d.can_export_csv;
  const csvBtn = document.getElementById('csvBtn');
  csvBtn.style.display = canCsv ? '' : 'none';
  document.getElementById('csvHint').textContent = '';
  csvBtn.onclick = () => { location.href = '/api/links/stats?id=' + encodeURIComponent(id) + '&format=csv'; };
  document.getElementById('detailModal').classList.add('active');
}

function closeDetail() { document.getElementById('detailModal').classList.remove('active'); }

async function doLogin() {
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPwd').value;
  const err = document.getElementById('loginErr');
  err.style.display = 'none';
  if (!email || !password) { err.textContent = '请填写邮箱和密码'; err.style.display = 'block'; return; }
  const r = await fetch('/api/auth/login', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email, password })
  });
  const d = await r.json();
  if (d.error) { err.textContent = d.error; err.style.display = 'block'; return; }
  document.getElementById('loginModal').classList.remove('active');
  await checkAuth();
  load();
}

document.getElementById('detailModal').onclick = (e) => { if (e.target.id === 'detailModal') closeDetail(); };
document.getElementById('contactModal').addEventListener('click', (e) => { if (e.target.id === 'contactModal') closeContact(); });
document.getElementById('contactModal').addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target && e.target.tagName !== 'TEXTAREA' && e.target.id !== 'cm_type') { e.preventDefault(); submitContact(); } });

(async function init() {
  if (await checkAuth()) load();
})();
</script>
</body>
</html>
