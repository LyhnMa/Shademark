<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>忘记密码 — ShadeMark</title>
<meta name="description" content="用注册邮箱找回 ShadeMark 账号密码。" />
<link rel="canonical" href="https://shademark.cn/forgot">
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.png" type="image/png">
<style>
:root{
  --bg:#0d0d0f;--card:#17171b;--border:#2a2a33;
  --panel:#17171b;--radius:12px;--radius-sm:8px;
  --text:#e8e8ea;--muted:#8a8a94;--accent:#7c6cf0;
  --danger:#f87171;--error:#f87171;--success:#4ade80;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh}

/* —— 弹窗外壳：与全站同一套（modal / modal-card / modal-head / modal-close）—— */
.modal{display:none;position:fixed;inset:0;background:rgba(6,6,9,.72);backdrop-filter:blur(4px);z-index:300;align-items:center;justify-content:center;padding:20px}
.modal.active{display:flex}
.modal-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);width:100%;max-width:380px;padding:24px;max-height:88vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.brand-mini{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text);margin-bottom:18px}
.brand-mini img{width:32px;height:32px;object-fit:contain;border-radius:8px}
.brand-mini span{font-size:16px;font-weight:700;letter-spacing:-0.02em;color:var(--text)}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}
.modal-title{font-size:15px;font-weight:700}
.modal-close{background:none;border:none;color:var(--muted);font-size:22px;line-height:1;cursor:pointer;padding:0 4px}
.modal-close:hover{color:var(--text)}
.modal-card input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);padding:11px 12px;font-size:14px;outline:none;margin-bottom:12px;min-height:44px;font-family:inherit}
.modal-card input:focus{border-color:var(--accent)}
.sub{color:var(--muted);font-size:13px;line-height:1.6;margin-bottom:16px}
.auth-submit{width:100%;background:var(--accent);color:#fff;border:none;border-radius:6px;padding:12px;font-size:14px;font-weight:600;cursor:pointer;transition:filter .2s;min-height:46px;font-family:inherit}
.auth-submit:hover{filter:brightness(.9)}
.auth-submit:disabled{opacity:.5;cursor:not-allowed}
.ghost{width:100%;background:transparent;border:1px solid var(--border);color:var(--text);border-radius:6px;padding:12px;font-size:14px;font-weight:600;cursor:pointer;transition:border-color .2s;min-height:46px;font-family:inherit}
.ghost:hover{border-color:var(--accent)}
.auth-error{color:var(--error);font-size:13px;margin:-4px 0 12px;display:none;line-height:1.6}
.hint{color:var(--muted);font-size:12px;margin-top:14px;line-height:1.7;text-align:center}
.ok{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px}
.ok .mark{width:36px;height:36px;border-radius:50%;background:#14432c;color:var(--success);display:flex;align-items:center;justify-content:center;font-size:18px}
.ok p{font-size:14px;line-height:1.7;color:var(--text)}
@media(max-width:600px){.modal{padding:16px}.modal-card{padding:20px}}
</style>
</head>
<body>

<!-- 忘记密码：与全站登录卡同一套外壳 -->
<div class="modal active" id="forgotModal">
  <div class="modal-card">
    <a class="brand-mini" href="/"><img src="/logo.png" alt="ShadeMark"><span>ShadeMark</span></a>
    <div class="modal-head">
      <h3 class="modal-title">忘记密码</h3>
      <button class="modal-close" id="fpCloseBtn" aria-label="关闭">&times;</button>
    </div>
    <p class="sub">填注册邮箱，我们把重置链接发给你</p>

    <div id="stepForm">
      <div><input id="fpEmail" type="email" placeholder="your@email.com" autocomplete="email" /></div>
      <div class="auth-error" id="fpError"></div>
      <button class="auth-submit" id="fpBtn" onclick="doForgot()">发送重置链接</button>
      <p class="hint">同一个邮箱 15 分钟内最多发 3 次<br>链接 30 分钟内有效</p>
    </div>

    <div id="stepDone" style="display:none">
      <div class="ok">
        <div class="mark">✓</div>
        <p id="doneText">如果这个邮箱已注册，重置链接已经发过去了。请查收（也看一眼垃圾邮件箱）。</p>
      </div>
      <div style="margin-top:20px"><button class="ghost" onclick="showForm()">换一个邮箱再试</button></div>
    </div>
  </div>
</div>
<script>
function showForm(){
  document.getElementById('stepDone').style.display='none';
  document.getElementById('stepForm').style.display='block';
  document.getElementById('fpError').style.display='none';
  document.getElementById('fpEmail').focus();
}
async function doForgot(){
  const email=document.getElementById('fpEmail').value.trim();
  const err=document.getElementById('fpError');
  const btn=document.getElementById('fpBtn');
  err.style.display='none';
  if(!email){err.textContent='请填写邮箱';err.style.display='block';return}
  btn.disabled=true;btn.textContent='发送中...';
  try{
    const r=await fetch('/api/auth/forgot-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email})});
    const d=await r.json().catch(()=>({}));
    if(d.error){err.textContent=d.error;err.style.display='block';return}
    document.getElementById('doneText').textContent=d.message||'如果这个邮箱已注册，重置链接已经发过去了。请查收（也看一眼垃圾邮件箱）。';
    document.getElementById('stepForm').style.display='none';
    document.getElementById('stepDone').style.display='block';
  }catch(e){err.textContent='网络错误，请稍后再试';err.style.display='block'}
  finally{btn.disabled=false;btn.textContent='发送重置链接'}
}
document.getElementById('fpEmail').addEventListener('keydown',e=>{if(e.key==='Enter')doForgot()});
// 关掉 = 回登录（与页脚「返回登录」等价）
function fpClose(){location.href='/login'}
document.getElementById('fpCloseBtn').addEventListener('click',fpClose);
document.getElementById('forgotModal').addEventListener('click',e=>{if(e.target.id==='forgotModal')fpClose()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')fpClose()});
</script>
</body>
</html>
